<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画像ツール</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--text:#1d1f23;--muted:#5b616b;--border:#dcdfe4;--accent:#2b6cdf;--accent-text:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#262626;--text:#eee;--muted:#a8a8a8;--border:#3a3a3a;--accent:#4c8dff;--accent-text:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
main{max-width:960px;margin:0 auto;padding:32px 16px 48px}
h1{margin:0 0 4px;font-size:1.6rem}
.lead{margin:0 0 24px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card h2{margin:0;font-size:1.1rem}
.card p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
.btn{align-self:flex-start;display:inline-block;background:var(--accent);color:var(--accent-text);text-decoration:none;font-weight:600;padding:8px 18px;border-radius:8px}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
footer{margin-top:32px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
  <h1>画像ツール</h1>
  <p class="lead">ブラウザだけで使える画像編集ツール集です。画像は外部に送信されません。</p>
  <div class="grid" id="grid"></div>
  <footer>ツールを選んで「開く」を押してください。</footer>
</main>
<script src="nav.js"></script>
<script>
(function(){
  var grid=document.getElementById('grid');
  (window.SITE_TOOLS||[]).forEach(function(t){
    var c=document.createElement('section');c.className='card';
    var h=document.createElement('h2');h.textContent=t.name;
    var p=document.createElement('p');p.textContent=t.desc;
    var a=document.createElement('a');a.className='btn';a.href=t.url;a.textContent='開く';
    a.setAttribute('aria-label',t.name+'を開く');
    c.appendChild(h);c.appendChild(p);c.appendChild(a);grid.appendChild(c);
  });
})();
</script>
</body>
</html>
